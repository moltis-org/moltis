[package]
description       = "Provider-neutral connector persistence and projections for Moltis"
edition.workspace = true
name              = "moltis-connectors"
version.workspace = true

[features]
default = ["tracing"]
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = { workspace = true }
metrics    = { optional = true, workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
time       = { workspace = true }
tokio      = { workspace = true }
tracing    = { optional = true, workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
