<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{ page_title }} · moltis</title>
<link rel="icon" type="image/png" sizes="96x96" href="{{ asset_prefix }}icons/icon-96.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ asset_prefix }}icons/icon-72.png">
<link rel="stylesheet" href="{{ asset_prefix }}css/base.css">
<link rel="stylesheet" href="{{ asset_prefix }}css/components.css">
<link rel="stylesheet" href="{{ asset_prefix }}style.css">
<script nonce="{{ nonce }}">!function(){var t=localStorage.getItem("moltis-theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.background=t==="dark"?"#0f1115":"#f7f5ef";document.documentElement.style.color=t==="dark"?"#ece7db":"#211c15"}()</script>
<style>
  :root{
    --error-page-bg:linear-gradient(180deg, rgba(242,154,48,.12), rgba(242,154,48,0) 42%), radial-gradient(circle at top left, rgba(236,96,50,.16), transparent 32%), radial-gradient(circle at bottom right, rgba(230,203,89,.14), transparent 28%);
    --error-card-bg:color-mix(in srgb, var(--surface) 86%, transparent);
    --error-card-shadow:0 28px 80px rgba(15,17,21,.16);
    --error-path-bg:rgba(128,128,128,.12);
  }
  html[data-theme="dark"]{
    --error-page-bg:linear-gradient(180deg, rgba(255,166,77,.12), rgba(255,166,77,0) 42%), radial-gradient(circle at top left, rgba(255,113,67,.20), transparent 32%), radial-gradient(circle at bottom right, rgba(235,204,89,.16), transparent 28%);
    --error-card-bg:rgba(20,24,29,.82);
    --error-card-shadow:0 28px 90px rgba(0,0,0,.42);
    --error-path-bg:rgba(255,255,255,.08);
  }
  body{
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.25rem, 4vw, 3rem);
    background:var(--error-page-bg), var(--bg);
  }
  .error-layout{
    width:min(100%, 920px);
    position:relative;
  }
  .error-layout::before,
  .error-layout::after{
    content:"";
    position:absolute;
    inset:auto;
    width:13rem;
    height:13rem;
    border-radius:999px;
    filter:blur(18px);
    opacity:.7;
    pointer-events:none;
  }
  .error-layout::before{
    top:-2.5rem;
    right:2rem;
    background:rgba(242,154,48,.18);
  }
  .error-layout::after{
    bottom:-2rem;
    left:1rem;
    background:rgba(227,97,58,.14);
  }
  .error-card{
    position:relative;
    overflow:hidden;
    padding:clamp(1.5rem, 3.5vw, 2.75rem);
    border:1px solid color-mix(in srgb, var(--border) 74%, transparent);
    border-radius:28px;
    background:var(--error-card-bg);
    box-shadow:var(--error-card-shadow);
    backdrop-filter:blur(16px);
  }
  .error-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,.10), transparent 42%);
    pointer-events:none;
  }
  .error-badge{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    padding:.42rem .8rem;
    border-radius:999px;
    background:rgba(242,154,48,.14);
    color:var(--text-strong);
    font-size:.76rem;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .error-badge-dot{
    width:.55rem;
    height:.55rem;
    border-radius:999px;
    background:linear-gradient(135deg, #f29a30, #e3613a);
    box-shadow:0 0 0 .2rem rgba(242,154,48,.14);
  }
  .error-grid{
    display:grid;
    grid-template-columns:minmax(0, 1.2fr) minmax(240px, .8fr);
    gap:1.75rem;
    margin-top:1.4rem;
  }
  .error-title{
    margin:.2rem 0 0;
    font-size:clamp(2rem, 4vw, 3.75rem);
    line-height:1;
    letter-spacing:-.04em;
    color:var(--text-strong);
  }
  .error-copy{
    margin:.95rem 0 0;
    max-width:32rem;
    font-size:1.02rem;
    line-height:1.7;
    color:var(--muted);
  }
  .error-detail{
    margin:.8rem 0 0;
    font-size:.92rem;
    line-height:1.6;
    color:var(--muted);
  }
  .error-actions{
    display:flex;
    flex-wrap:wrap;
    gap:.85rem;
    margin-top:1.5rem;
  }
  .error-home-link{
    text-decoration:none;
  }
  .error-meta{
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .error-panel{
    padding:1rem 1.05rem;
    border-radius:20px;
    border:1px solid color-mix(in srgb, var(--border) 72%, transparent);
    background:color-mix(in srgb, var(--surface) 86%, transparent);
  }
  .error-panel-label{
    margin:0;
    font-size:.76rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .error-panel-value{
    margin:.55rem 0 0;
    color:var(--text-strong);
    font-size:1.02rem;
    line-height:1.5;
  }
  .error-path{
    margin:.7rem 0 0;
    padding:.7rem .85rem;
    border-radius:14px;
    background:var(--error-path-bg);
    font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size:.88rem;
    line-height:1.5;
    word-break:break-word;
    color:var(--text-strong);
  }
  .error-footer{
    margin-top:1rem;
    font-size:.82rem;
    color:var(--muted);
  }
  @media (max-width: 760px){
    .error-grid{
      grid-template-columns:1fr;
    }
    .error-layout::before,
    .error-layout::after{
      width:9rem;
      height:9rem;
    }
  }
</style>
</head>
<body>
<main class="error-layout">
  <section class="error-card">
    <div class="error-badge">
      <span class="error-badge-dot"></span>
      <span>{{ eyebrow }}</span>
    </div>
    <div class="error-grid">
      <div>
        <h1 class="error-title">{{ heading }}</h1>
        <p class="error-copy">{{ message }}</p>
        <p class="error-detail">{{ detail }}</p>
        <div class="error-actions">
          <a class="provider-btn error-home-link" href="/">Go to home page</a>
        </div>
      </div>
      <div class="error-meta">
        <div class="error-panel">
          <p class="error-panel-label">HTTP status</p>
          <p class="error-panel-value">{{ status_code }}</p>
        </div>
        {% if show_requested_path %}
        <div class="error-panel">
          <p class="error-panel-label">Requested path</p>
          <p class="error-path">{{ requested_path }}</p>
        </div>
        {% endif %}
      </div>
    </div>
    <p class="error-footer">If you followed an old bookmark or stale link, the home page should get you back to safety.</p>
  </section>
</main>
</body>
</html>
