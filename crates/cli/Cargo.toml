[package]
description       = "Personal AI gateway inspired by OpenClaw"
edition.workspace = true
homepage          = "https://www.moltis.org/"
license           = "MIT"
name              = "moltis"
repository        = "https://github.com/moltis-org/moltis"
version.workspace = true

[package.metadata.deb]
assets = [
  [
    "target/release/moltis",
    "usr/bin/",
    "755",
  ],
  [
    "../web/src/assets/**/*",
    "usr/share/moltis/web/",
    "644",
  ],
  [
    "../../docs/src/**/*",
    "usr/share/moltis/docs/",
    "644",
  ],
  [
    "target/release/moltis_wasm_calc.wasm",
    "usr/share/moltis/wasm/",
    "644",
  ],
  [
    "target/release/moltis_wasm_web_fetch.wasm",
    "usr/share/moltis/wasm/",
    "644",
  ],
  [
    "target/release/moltis_wasm_web_search.wasm",
    "usr/share/moltis/wasm/",
    "644",
  ],
]
copyright = "2025, Moltis Contributors"
depends = "$auto"
maintainer = "Moltis Contributors"
name = "moltis"
priority = "optional"
section = "net"

[package.metadata.generate-rpm]
assets = [
  { dest = "/usr/bin/moltis", mode = "0755", source = "target/release/moltis" },
  { dest = "/usr/share/moltis/docs/", mode = "0644", source = "docs/src/**/*" },
  { dest = "/usr/share/moltis/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/moltis_wasm_calc.wasm" },
  { dest = "/usr/share/moltis/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/moltis_wasm_web_fetch.wasm" },
  { dest = "/usr/share/moltis/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/moltis_wasm_web_search.wasm" },
  { dest = "/usr/share/moltis/web/", mode = "0644", source = "crates/web/src/assets/**/*" },
]
license = "MIT"
name = "moltis"
summary = "Personal AI gateway inspired by OpenClaw"
url = "https://www.moltis.org/"

[[bin]]
name = "moltis"
path = "src/main.rs"

[dependencies]
agent-client-protocol   = { optional = true, workspace = true }
anyhow                  = { workspace = true }
async-trait             = { workspace = true }
clap                    = { workspace = true }
dotenvy                 = { workspace = true }
indicatif               = { workspace = true }
moltis-acp              = { optional = true, workspace = true }
moltis-agents           = { workspace = true }
moltis-browser          = { workspace = true }
moltis-chat             = { optional = true, workspace = true }
moltis-claude-import    = { optional = true, workspace = true }
moltis-codex-import     = { optional = true, workspace = true }
moltis-common           = { workspace = true }
moltis-config           = { workspace = true }
moltis-connectors       = { optional = true, workspace = true }
moltis-cron             = { workspace = true }
moltis-gateway          = { workspace = true }
moltis-hermes-import    = { optional = true, workspace = true }
moltis-httpd            = { workspace = true }
moltis-import-core      = { workspace = true }
moltis-mcp              = { optional = true, workspace = true }
moltis-mcp-agent-bridge = { optional = true, workspace = true }
moltis-memory           = { workspace = true }
moltis-memory-zvec      = { optional = true, workspace = true }
moltis-node-host        = { workspace = true }
moltis-oauth            = { workspace = true }
moltis-onboarding       = { workspace = true }
moltis-openclaw-import  = { optional = true, workspace = true }
moltis-plugins          = { workspace = true }
moltis-portable         = { workspace = true }
moltis-projects         = { workspace = true }
moltis-protocol         = { workspace = true }
moltis-providers        = { workspace = true }
moltis-service-traits   = { optional = true, workspace = true }
moltis-sessions         = { workspace = true }
moltis-skills           = { workspace = true }
moltis-tools            = { workspace = true }
moltis-web              = { optional = true, workspace = true }
open                    = { workspace = true }
rand                    = { workspace = true }
reqwest                 = { workspace = true }
secrecy                 = { workspace = true }
serde_json              = { workspace = true }
sqlx                    = { workspace = true }
time                    = { workspace = true }
tokio                   = { workspace = true }
tracing                 = { workspace = true }
tracing-subscriber      = { workspace = true }
uuid                    = { workspace = true }
which                   = { workspace = true }

[target.'cfg(all(not(target_os = "windows"), not(all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
tikv-jemallocator = { optional = true, workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile    = { workspace = true }

[features]
acp = [
  "dep:agent-client-protocol",
  "dep:moltis-acp",
  "dep:moltis-chat",
  "dep:moltis-mcp",
  "dep:moltis-mcp-agent-bridge",
  "dep:moltis-service-traits",
]
agent = ["moltis-gateway/agent", "moltis-web?/agent"]
caldav = ["moltis-gateway/caldav"]
cloudflare-tunnel = ["moltis-httpd/cloudflare-tunnel", "moltis-web?/cloudflare-tunnel"]
connectors = [
  "dep:moltis-connectors",
  "moltis-gateway/connectors",
  "moltis-httpd/connectors",
  "moltis-web?/connectors",
]
home-assistant = ["moltis-gateway/home-assistant"]
# User-facing integrations stay default-on in the CLI crate per workspace policy,
# even when the underlying implementation remains feature-gated in lower crates.
#
# `portable` is the self-contained feature set used by release packages. `full`
# adds zvec for source and container builds, where its native runtime can be
# provided. Both exclude build-mode toggles (`embedded-*`) and accelerator-
# specific features (`local-llm-cuda`, `local-llm-vulkan`).
bundled-skills = ["moltis-gateway/bundled-skills", "moltis-web?/bundled-skills"]
default = ["full"]
full = ["portable", "zvec"]
llm-compaction = ["moltis-gateway/llm-compaction"]
portable = [
  "acp",
  "agent",
  "bundled-skills",
  "caldav",
  "claude-import",
  "cloudflare-tunnel",
  "code-index-builtin",
  "code-splitter",
  "codex-import",
  "connectors",
  "discord",
  "file-watcher",
  "firecrawl",
  "fs-tools",
  "graphql",
  "hermes-import",
  "home-assistant",
  "jemalloc",
  "lang-bash",
  "lang-c",
  "lang-cpp",
  "lang-css",
  "lang-go",
  "lang-html",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-markdown",
  "lang-python",
  "lang-ruby",
  "lang-rust",
  "lang-toml",
  "lang-typescript",
  "langfuse",
  "llm-compaction",
  "local-embeddings",
  "local-llm",
  "local-llm-metal",
  "matrix",
  "mdns",
  "metrics",
  "msteams",
  "netbird",
  "ngrok",
  "nostr",
  "openclaw-import",
  "otlp",
  "prometheus",
  "provider-github-copilot",
  "provider-kimi-code",
  "provider-openai-codex",
  "push-notifications",
  "qmd",
  "signal",
  "slack",
  "tailscale",
  "telegram",
  "telephony",
  "tls",
  "trusted-network",
  "vault",
  "vercel-sandbox",
  "voice",
  "wasm",
  "web-ui",
  "whatsapp",
]
# Minimal build for memory-constrained devices (Raspberry Pi, etc.).
# Build with: cargo build --release --no-default-features --features lightweight
code-index-builtin = ["moltis-gateway/code-index-builtin"]
code-splitter      = ["moltis-memory/code-splitter"]
discord            = ["moltis-httpd/discord"]
embedded-assets    = ["moltis-web?/embedded-assets"]
embedded-wasm      = ["moltis-tools/embedded-wasm"]
file-watcher       = ["moltis-gateway/file-watcher"]
firecrawl          = ["moltis-gateway/firecrawl"]
fs-tools           = ["moltis-gateway/fs-tools"]
graphql            = ["moltis-httpd/graphql", "moltis-web?/graphql"]
jemalloc           = ["dep:tikv-jemallocator"]
lang-bash          = ["moltis-memory/lang-bash"]
lang-c             = ["moltis-memory/lang-c"]
lang-cpp           = ["moltis-memory/lang-cpp"]
lang-css           = ["moltis-memory/lang-css"]
lang-go            = ["moltis-memory/lang-go"]
lang-html          = ["moltis-memory/lang-html"]
lang-java          = ["moltis-memory/lang-java"]
lang-javascript    = ["moltis-memory/lang-javascript"]
lang-json          = ["moltis-memory/lang-json"]
lang-markdown      = ["moltis-memory/lang-markdown"]
lang-python        = ["moltis-memory/lang-python"]
lang-ruby          = ["moltis-memory/lang-ruby"]
lang-rust          = ["moltis-memory/lang-rust"]
lang-toml          = ["moltis-memory/lang-toml"]
lang-typescript    = ["moltis-memory/lang-typescript"]
# jemalloc is intentionally unavailable on linux/aarch64 to avoid runtime
# crashes on 16 KiB page kernels (e.g. Raspberry Pi OS variants).
claude-import = ["dep:moltis-claude-import", "moltis-gateway/claude-import"]
codex-import  = ["dep:moltis-codex-import", "moltis-gateway/codex-import"]
hermes-import = ["dep:moltis-hermes-import", "moltis-gateway/hermes-import"]
# Instrumentation exporters. Default-on so the `[instrumentation]` config can be
# switched on without a rebuild; enabling the config, not the feature, is what
# starts sending data. `langfuse` implies `otlp`: Langfuse ingests traces over
# the OTLP wire format.
langfuse = ["moltis-gateway/langfuse"]
lightweight = ["jemalloc", "tls", "web-ui"]
local-embeddings = ["moltis-gateway/local-embeddings"]
local-llm = ["moltis-gateway/local-llm"]
local-llm-cuda = ["local-llm", "moltis-gateway/local-llm-cuda"]
local-llm-metal = ["local-llm", "moltis-gateway/local-llm-metal"]
local-llm-vulkan = ["local-llm", "moltis-gateway/local-llm-vulkan"]
matrix = ["moltis-httpd/matrix"]
mdns = ["moltis-gateway/mdns"]
metrics = ["moltis-httpd/metrics", "moltis-web?/metrics"]
msteams = ["moltis-httpd/msteams"]
netbird = ["moltis-httpd/netbird", "moltis-web?/netbird"]
ngrok = ["moltis-httpd/ngrok", "moltis-web?/ngrok"]
nostr = ["moltis-httpd/nostr"]
openclaw-import = ["dep:moltis-openclaw-import", "moltis-gateway/openclaw-import"]
otlp = ["moltis-gateway/otlp"]
prometheus = ["moltis-httpd/prometheus"]
provider-github-copilot = [
  "moltis-gateway/provider-github-copilot",
  "moltis-providers/provider-github-copilot",
]
provider-kimi-code = ["moltis-gateway/provider-kimi-code", "moltis-providers/provider-kimi-code"]
provider-openai-codex = ["moltis-gateway/provider-openai-codex"]
push-notifications = ["moltis-httpd/push-notifications", "moltis-web?/push-notifications"]
qmd = ["moltis-gateway/qmd"]
signal = ["moltis-httpd/signal"]
slack = ["moltis-httpd/slack"]
tailscale = ["moltis-httpd/tailscale", "moltis-web?/tailscale"]
telegram = ["moltis-gateway/telegram"]
telephony = ["moltis-httpd/telephony"]
tls = ["moltis-httpd/tls"]
trusted-network = ["moltis-httpd/trusted-network"]
vault = ["moltis-httpd/vault", "moltis-web?/vault"]
vercel-sandbox = ["moltis-tools/vercel-sandbox"]
voice = ["moltis-gateway/voice", "moltis-web?/voice"]
wasm = ["moltis-tools/wasm"]
web-ui = ["dep:moltis-web", "moltis-httpd/web-ui"]
whatsapp = ["moltis-gateway/whatsapp"]
zvec = ["dep:moltis-memory-zvec", "moltis-gateway/zvec"]

[lints]
workspace = true
