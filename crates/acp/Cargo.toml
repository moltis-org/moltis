[package]
edition.workspace    = true
name                 = "moltis-acp"
repository.workspace = true
version.workspace    = true

[features]
default = []
metrics = ["dep:moltis-metrics"]
tracing = ["dep:tracing"]

[dependencies]
agent-client-protocol = { workspace = true }
anyhow                = { workspace = true }
async-trait           = { workspace = true }
bytes                 = { workspace = true }
futures               = { workspace = true }
moltis-metrics        = { optional = true, workspace = true }
serde_json            = { workspace = true }
tokio                 = { workspace = true }
tokio-util            = { features = ["codec", "compat", "io"], workspace = true }
tracing               = { optional = true, workspace = true }

[dev-dependencies]
# `tracing` is here as well as behind the optional feature above: the
# stdout-hygiene test drives a subscriber at TRACE whatever features the crate is
# built with, and the coverage job builds with default features only.
tokio-test         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
