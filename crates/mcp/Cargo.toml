[package]
edition.workspace = true
name              = "moltis-mcp"
version.workspace = true

[features]
default = ["metrics"]
metrics = ["dep:moltis-metrics", "moltis-git-repositories/metrics"]

[dependencies]
async-trait             = { workspace = true }
fs2                     = { workspace = true }
futures                 = { workspace = true }
moltis-common           = { features = ["process"], workspace = true }
moltis-config           = { workspace = true }
moltis-git-repositories = { workspace = true }
moltis-metrics          = { optional = true, workspace = true }
moltis-oauth            = { workspace = true }
reqwest                 = { workspace = true }
secrecy                 = { workspace = true }
serde                   = { workspace = true }
serde_json              = { workspace = true }
sha2                    = { workspace = true }
tempfile                = { workspace = true }
thiserror               = { workspace = true }
time                    = { workspace = true }
tokio                   = { workspace = true }
tokio-util              = { features = ["codec"], workspace = true }
tracing                 = { workspace = true }
url                     = { workspace = true }
uuid                    = { workspace = true }

[dev-dependencies]
mockito    = { workspace = true }
tokio-test = { workspace = true }
