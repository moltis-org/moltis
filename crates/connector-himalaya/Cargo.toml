[package]
description          = "Read-only Himalaya v2 adapter for Moltis connectors"
edition.workspace    = true
license.workspace    = true
name                 = "moltis-connector-himalaya"
repository.workspace = true
version.workspace    = true

[features]
default = ["tracing"]
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
anyhow            = { workspace = true }
async-trait       = { workspace = true }
mail-parser       = { workspace = true }
metrics           = { optional = true, workspace = true }
moltis-agents     = { workspace = true }
moltis-common     = { features = ["process"], workspace = true }
moltis-connectors = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sha2              = { workspace = true }
thiserror         = { workspace = true }
time              = { workspace = true }
tokio             = { features = ["io-util", "process", "sync", "time"], workspace = true }
tracing           = { optional = true, workspace = true }
which             = { workspace = true }

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true
