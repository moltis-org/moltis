[Service]
# Rootless Podman needs user namespace re-exec plus writable storage and runtime
# directories. Keep ProtectHome enabled by locating its home under /var/lib.
NoNewPrivileges=false
Delegate=yes
Environment=HOME=/var/lib/moltis
Environment=XDG_DATA_HOME=/var/lib/moltis/.local/share
Environment=XDG_CONFIG_HOME=/var/lib/moltis/.config
Environment=XDG_RUNTIME_DIR=/run/moltis
RuntimeDirectory=moltis
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
