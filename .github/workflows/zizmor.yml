name: Zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo woodruffw/zizmor --pattern 'zizmor-x86_64-unknown-linux-gnu.tar.gz'
          tar xzf zizmor-x86_64-unknown-linux-gnu.tar.gz
          chmod +x zizmor

      - name: Run zizmor
        run: ./zizmor --format sarif .github/workflows/ > results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2b983b380ce715a6c836c917154509c332c19b3a # v3
        with:
          sarif_file: results.sarif
          category: zizmor
