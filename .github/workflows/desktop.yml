name: Desktop App

# apps/desktop is its own Cargo workspace, so the main CI does not build it.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "scripts/package-desktop-*.sh"
      - "crates/client/**"
      - "crates/protocol/**"
      - "crates/config/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/package-desktop-*.sh"
      - "crates/client/**"
      - "crates/protocol/**"
      - "crates/config/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Must match rust-toolchain.toml (single source of truth for the nightly pin).
  NIGHTLY_TOOLCHAIN: nightly-2026-06-20

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # gpui's X11/Wayland backends, keyboard handling, fonts and Vulkan.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: apps/desktop
          shared-key: desktop-v1-${{ matrix.name }}

      - name: Format
        working-directory: apps/desktop
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: apps/desktop
        run: |
          cargo clippy --locked --all-targets --features mockup -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test
        working-directory: apps/desktop
        run: |
          cargo test --locked
          cargo test --locked --features mockup mockup::

      - name: Client crate tests
        run: cargo test --locked -p moltis-client --all-features
