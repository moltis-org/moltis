name: Nix Build

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main", "feat/**" ]

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v20
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    # - name: Setup Cachix (optional, if you have one)
    #   uses: cachix/cachix-action@v12
    #   with:
    #     name: moltis-cache # Replace with your Cachix cache name
    #     # authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}' # Uncomment if your cache is private

    - name: Build project with Nix
      run: nix build

